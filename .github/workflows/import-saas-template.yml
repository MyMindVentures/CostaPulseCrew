name: Import SaaS template

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import-template:
    if: github.head_ref == 'setup/saas-template'
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: setup/saas-template
          fetch-depth: 0

      - name: Download free MIT SaaS template
        run: |
          git clone --depth 1 https://github.com/ixartz/SaaS-Boilerplate.git /tmp/saas-template
          rm -rf /tmp/saas-template/.git

      - name: Replace branch contents with template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/saas-template/. .
          git add -A
          git commit -m "Import ixartz SaaS Boilerplate as clean project base"
          git push origin setup/saas-template
